name: Release

# Pushing a tag such as 1.2.0 builds a zip and attaches it to a GitHub release.
# Deploying to WordPress.org needs the SVN_USERNAME and SVN_PASSWORD repository secrets.

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
      SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the plugin version
        run: |
          VERSION=$(grep -m1 -E '^\s*\*\s*Version:' adventure-treks.php | sed -E 's/.*Version:\s*//' | tr -d '[:space:]')
          if [ "$VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match plugin version $VERSION"
            exit 1
          fi
          STABLE=$(grep -m1 -E '^Stable tag:' readme.txt | sed -E 's/Stable tag:\s*//' | tr -d '[:space:]')
          if [ "$STABLE" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match readme.txt Stable tag $STABLE"
            exit 1
          fi

      - name: Build zip
        run: |
          mkdir -p dist/adventure-treks
          rsync -a --exclude-from=.distignore --exclude='.git' ./ dist/adventure-treks/
          cd dist && zip -qr adventure-treks.zip adventure-treks

      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/adventure-treks.zip
          generate_release_notes: true

      - name: Deploy to WordPress.org
        if: ${{ env.SVN_USERNAME != '' }}
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SLUG: adventure-treks
